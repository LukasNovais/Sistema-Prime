<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Prime Transportadora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0a0f1d;
            height: 100svh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed; /* Trava a tela para não "quicar" ao rolar */
            width: 100%;
        }

        /* Área de conteúdo que estica para ocupar o espaço entre header e nav */
        main {
            flex-grow: 1;
            width: 100%;
            position: relative;
            background: #0a0f1d;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .tab-content { 
            display: none; 
            width: 100%;
            height: 100%;
            max-width: 100%;
        }
        
        .tab-content.active { display: block; }
        
        iframe { width: 100%; height: 100%; border: none; }

        /* NAV FLUTUANTE - Otimizado para Mobile e Notebook */
        nav {
            background: #161e2e;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 70px; /* Reduzido de 85px para ficar mais elegante */
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            width: 100%;
            flex-shrink: 0; /* Impede o menu de espremer */
            z-index: 9999;
        }

        .nav-link {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: #94a3b8;
            transition: 0.2s;
            cursor: pointer;
        }

        .nav-link svg { width: 22px; height: 22px; fill: currentColor; }
        .nav-link span { font-size: 10px; font-weight: 700; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

        .nav-link.active { 
            color: #f59e0b; 
            background: rgba(245, 158, 11, 0.05);
        }

        header { flex-shrink: 0; }

        /* Ajustes elegantes para telas de Notebook / Desktop */
        @media (min-width: 768px) {
            header .header-container {
                max-width: 900px;
                margin: 0 auto;
            }
            .tab-content {
                max-width: 900px;
                margin: 0 auto;
            }
            nav {
                height: 60px;
                max-width: 900px;
                margin: 0 auto;
                border-radius: 12px 12px 0 0;
                border-left: 1px solid rgba(255,255,255,0.05);
                border-right: 1px solid rgba(255,255,255,0.05);
            }
        }
    </style>
</head>
<body>

    <header class="bg-[#161e2e] border-b border-white/5 p-3 md:p-4">
        <div class="header-container flex justify-between items-center w-full">
            <div class="flex items-center gap-2.5">
                <div class="bg-amber-500 p-1.5 rounded-lg shadow">
                    <svg viewBox="0 0 640 512" class="w-4 h-4 fill-[#0a0f1d]"><path d="M624 352h-16V243.9c0-12.7-5.1-24.9-14.1-33.9L494 110.1c-9-9-21.2-14.1-33.9-14.1H416V48c0-26.5-21.5-48-48-48H48C21.5 0 0 21.5 0 48v320c0 26.5 21.5 48 48 48h16c0 53 43 96 96 96s96-43 96-96h128c0 53 43 96 96 96s96-43 96-96h48c8.8 0 16-7.2 16-16v-32c0-8.8-7.2-16-16-16zM160 464c-26.5 0-48-21.5-48-48s21.5-48 48-48 48 21.5 48 48-21.5 48-48 48zm320 0c-26.5 0-48-21.5-48-48s21.5-48 48-48 48 21.5 48 48-21.5 48-48 48zm80-208H416V144h44.1l99.9 99.9V256z"/></svg>
                </div>
                <h1 class="text-white text-xs md:text-sm font-black italic uppercase tracking-wider">Sistema Prime</h1>
            </div>
            <div class="flex items-center gap-1.5 bg-slate-800/60 px-2.5 py-1 rounded-full border border-slate-700/40">
                <div class="h-2 w-2 rounded-full bg-amber-500 animate-pulse"></div>
                <span class="text-[9px] font-bold text-slate-300 uppercase tracking-wider">Online</span>
            </div>
        </div>
    </header>

    <main>
        <section id="aba1" class="tab-content active"><iframe src="aba1.html"></iframe></section>
        <section id="aba2" class="tab-content"><iframe src="aba2.html"></iframe></section>
        <section id="aba3" class="tab-content"><iframe src="aba3.html"></iframe></section>
    </main>

    <nav>
        <button onclick="openTab('aba1', this)" class="nav-link active">
            <svg viewBox="0 0 512 512"><path d="M64 256V160H224V256H64zm0 64H224V416H64V320zM288 416V320H448V416H288zM448 256H288V160H448V256zM64 32C28.7 32 0 60.7 0 96V416c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V96c0-35.3-28.7-64-64-64H64z"/></svg>
            <span>Tabela</span>
        </button>
        
        <button onclick="openTab('aba2', this)" class="nav-link">
            <svg viewBox="0 0 448 512"><path d="M64 32C28.7 32 0 60.7 0 96V416c0 35.3 28.7 64 64 64H384c35.3 0 64-28.7 64-64V96c0-35.3-28.7-64-64-64H64zM337 209L209 337c-9.4 9.4-24.6 9.4-33.9 0l-64-64c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l47 47L303 175c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9z"/></svg>
            <span>Calculadora</span>
        </button>
        
        <button onclick="openTab('aba3', this)" class="nav-link">
            <svg viewBox="0 0 384 512"><path d="M192 0c-41.8 0-77.4 26.7-90.5 64H64C28.7 64 0 92.7 0 128V448c0 35.3 28.7 64 64 64H320c35.3 0 64-28.7 64-64V128c0-35.3-28.7-64-64-64H282.5C269.4 26.7 233.8 0 192 0zm0 64a32 32 0 1 1 0 64 32 32 0 1 1 0-64zM112 192H272c8.8 0 16 7.2 16 16s-7.2 16-16 16H112c-8.8 0-16-7.2-16-16s7.2-16 16-16zM64 272c0-8.8 7.2-16 16-16H304c8.8 0 16 7.2 16 16s-7.2 16-16 16H80c-8.8 0-16-7.2-16-16zM80 352H208c8.8 0 16 7.2 16 16s-7.2 16-16 16H80c-8.8 0-16-7.2-16-16s7.2-16 16-16z"/></svg>
            <span>Ordem</span>
        </button>
    </nav>

    <script>
        function openTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }
    </script>
</body>
</html>
